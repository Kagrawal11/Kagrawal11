<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="100%" role="img" aria-label="Engineering loop diagram">
  <title>Engineering loop diagram</title>
  <defs>
    <filter id="glowY" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowP" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <path d="M90,70 L870,70 L870,270 L90,270 Z" fill="none" stroke="#2E3B47" stroke-width="3"/>
  <path d="M90,70 L870,70 L870,270 L90,270 Z" fill="none" stroke="#3B6E8F" stroke-width="3" stroke-dasharray="8 12" opacity="0.5">
    <animate attributeName="stroke-dashoffset" values="0;-200" dur="11s" repeatCount="indefinite"/>
  </path>
  <text x="480" y="164" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="13" fill="#8b8698">continuous loop</text>
  <text x="480" y="184" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="13" fill="#8b8698">not a one-way pipeline</text>
  <circle r="8" fill="#F2A93B" filter="url(#glowY)">
    <animateMotion path="M90,70 L870,70 L870,270 L90,270 Z" dur="11s" repeatCount="indefinite" rotate="auto"/>
  </circle>
  
  <g transform="translate(90.0,70.0)">
    <circle r="34" fill="#10161C" stroke="#24425A" stroke-width="2.5">
      <animate attributeName="stroke" values="#F2A93B;#F2A93B;#24425A;#24425A" keyTimes="0;0.001;0.1;1" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle r="34" fill="#3B6E8F">
      <animate attributeName="fill-opacity" values="0.22;0.22;0;0" keyTimes="0;0.001;0.1;1" dur="11s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="5" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11.5" font-weight="700" fill="#E2E8F0">MODEL</text>
  </g>
  <g transform="translate(416.7,70.0)">
    <circle r="34" fill="#10161C" stroke="#24425A" stroke-width="2.5">
      <animate attributeName="stroke" values="#24425A;#24425A;#F2A93B;#24425A;#24425A" keyTimes="0;0.1067;0.1667;0.2567;1" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle r="34" fill="#3B6E8F">
      <animate attributeName="fill-opacity" values="0;0;0.22;0;0" keyTimes="0;0.1067;0.1667;0.2567;1" dur="11s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="5" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11.5" font-weight="700" fill="#E2E8F0">CONTRACT</text>
  </g>
  <g transform="translate(743.3,70.0)">
    <circle r="34" fill="#10161C" stroke="#24425A" stroke-width="2.5">
      <animate attributeName="stroke" values="#24425A;#24425A;#F2A93B;#24425A;#24425A" keyTimes="0;0.2733;0.3333;0.4233;1" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle r="34" fill="#3B6E8F">
      <animate attributeName="fill-opacity" values="0;0;0.22;0;0" keyTimes="0;0.2733;0.3333;0.4233;1" dur="11s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="5" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11.5" font-weight="700" fill="#E2E8F0">BUILD</text>
  </g>
  <g transform="translate(870.0,270.0)">
    <circle r="34" fill="#10161C" stroke="#24425A" stroke-width="2.5">
      <animate attributeName="stroke" values="#24425A;#24425A;#F2A93B;#24425A;#24425A" keyTimes="0;0.44;0.5;0.59;1" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle r="34" fill="#3B6E8F">
      <animate attributeName="fill-opacity" values="0;0;0.22;0;0" keyTimes="0;0.44;0.5;0.59;1" dur="11s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="5" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11.5" font-weight="700" fill="#E2E8F0">AUTOMATE</text>
  </g>
  <g transform="translate(543.3,270.0)">
    <circle r="34" fill="#10161C" stroke="#24425A" stroke-width="2.5">
      <animate attributeName="stroke" values="#24425A;#24425A;#F2A93B;#24425A;#24425A" keyTimes="0;0.6067;0.6667;0.7567;1" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle r="34" fill="#3B6E8F">
      <animate attributeName="fill-opacity" values="0;0;0.22;0;0" keyTimes="0;0.6067;0.6667;0.7567;1" dur="11s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="5" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11.5" font-weight="700" fill="#E2E8F0">OBSERVE</text>
  </g>
  <g transform="translate(216.7,270.0)">
    <circle r="34" fill="#10161C" stroke="#24425A" stroke-width="2.5">
      <animate attributeName="stroke" values="#24425A;#24425A;#F2A93B;#24425A;#24425A" keyTimes="0;0.7733;0.8333;0.9233;1" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle r="34" fill="#3B6E8F">
      <animate attributeName="fill-opacity" values="0;0;0.22;0;0" keyTimes="0;0.7733;0.8333;0.9233;1" dur="11s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="5" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11.5" font-weight="700" fill="#E2E8F0">IMPROVE</text>
  </g>
</svg>
