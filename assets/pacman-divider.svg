<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 70" width="100%" role="img" aria-label="Pac-Man divider">
  <title>Pac-Man divider</title>
  <defs>
    <filter id="glowY" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowGhost" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <line x1="0" y1="35" x2="1200" y2="35" stroke="url(#rail)" stroke-width="1.5"/>

  <circle cx="30" cy="35" r="7" fill="#FFD400" filter="url(#glowY)">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.0455;0.0675;0.999;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="r" values="7;9;7" dur="0.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="90" cy="35" r="4" fill="#C084FC">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.0917;0.1137;0.999;1" dur="8s" repeatCount="indefinite"/>
    
  </circle>
  <circle cx="150" cy="35" r="4" fill="#C084FC">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.1378;0.1598;0.999;1" dur="8s" repeatCount="indefinite"/>
    
  </circle>
  <circle cx="210" cy="35" r="4" fill="#C084FC">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.184;0.206;0.999;1" dur="8s" repeatCount="indefinite"/>
    
  </circle>
  <circle cx="270" cy="35" r="4" fill="#C084FC">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.2302;0.2522;0.999;1" dur="8s" repeatCount="indefinite"/>
    
  </circle>
  <circle cx="330" cy="35" r="7" fill="#FFD400" filter="url(#glowY)">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.2763;0.2983;0.999;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="r" values="7;9;7" dur="0.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="390" cy="35" r="4" fill="#C084FC">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.3225;0.3445;0.999;1" dur="8s" repeatCount="indefinite"/>
    
  </circle>
  <circle cx="450" cy="35" r="4" fill="#C084FC">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.3686;0.3906;0.999;1" dur="8s" repeatCount="indefinite"/>
    
  </circle>
  <circle cx="510" cy="35" r="4" fill="#C084FC">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4148;0.4368;0.999;1" dur="8s" repeatCount="indefinite"/>
    
  </circle>
  <circle cx="570" cy="35" r="4" fill="#C084FC">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4609;0.4829;0.999;1" dur="8s" repeatCount="indefinite"/>
    
  </circle>
  <circle cx="630" cy="35" r="7" fill="#FFD400" filter="url(#glowY)">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5071;0.5291;0.999;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="r" values="7;9;7" dur="0.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="690" cy="35" r="4" fill="#C084FC">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5532;0.5752;0.999;1" dur="8s" repeatCount="indefinite"/>
    
  </circle>
  <circle cx="750" cy="35" r="4" fill="#C084FC">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5994;0.6214;0.999;1" dur="8s" repeatCount="indefinite"/>
    
  </circle>
  <circle cx="810" cy="35" r="4" fill="#C084FC">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.6455;0.6675;0.999;1" dur="8s" repeatCount="indefinite"/>
    
  </circle>
  <circle cx="870" cy="35" r="4" fill="#C084FC">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.6917;0.7137;0.999;1" dur="8s" repeatCount="indefinite"/>
    
  </circle>
  <circle cx="930" cy="35" r="7" fill="#FFD400" filter="url(#glowY)">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.7378;0.7598;0.999;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="r" values="7;9;7" dur="0.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="990" cy="35" r="4" fill="#C084FC">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.784;0.806;0.999;1" dur="8s" repeatCount="indefinite"/>
    
  </circle>
  <circle cx="1050" cy="35" r="4" fill="#C084FC">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.8302;0.8522;0.999;1" dur="8s" repeatCount="indefinite"/>
    
  </circle>
  <circle cx="1110" cy="35" r="4" fill="#C084FC">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.8763;0.8983;0.999;1" dur="8s" repeatCount="indefinite"/>
    
  </circle>
  <circle cx="1170" cy="35" r="4" fill="#C084FC">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.9225;0.9445;0.999;1" dur="8s" repeatCount="indefinite"/>
    
  </circle>

  <!-- motion trail (afterimage) -->
    <g opacity="0.12">
    <animateTransform attributeName="transform" type="translate" from="-50 0" to="1250 0" dur="8s" begin="-0.12s" repeatCount="indefinite"/>
    <circle cx="45" cy="35" r="15.0" fill="#FFD400"/>
  </g>

    <g opacity="0.22">
    <animateTransform attributeName="transform" type="translate" from="-50 0" to="1250 0" dur="8s" begin="-0.06s" repeatCount="indefinite"/>
    <circle cx="45" cy="35" r="17.0" fill="#FFD400"/>
  </g>


  <g transform="translate(-120,35)">
    <animateTransform attributeName="transform" type="translate" from="-120 35" to="1180 35" dur="8s" begin="1.1s" repeatCount="indefinite"/>
    <g filter="url(#glowGhost)">
      <path d="M -14,8 A14,14 0 1 1 14,8 L14,18 L9,13 L4,18 L0,13 L-4,18 L-9,13 L-14,18 Z" fill="#A855F7">
        <animate attributeName="d" dur="0.5s" repeatCount="indefinite" values="
          M -14,8 A14,14 0 1 1 14,8 L14,18 L9,13 L4,18 L0,13 L-4,18 L-9,13 L-14,18 Z;
          M -14,8 A14,14 0 1 1 14,8 L14,16 L9,20 L4,15 L0,20 L-4,15 L-9,20 L-14,16 Z;
          M -14,8 A14,14 0 1 1 14,8 L14,18 L9,13 L4,18 L0,13 L-4,18 L-9,13 L-14,18 Z"/>
      </path>
    </g>
    <circle cx="-5" cy="4" r="3.4" fill="#0B0B0F"/>
    <circle cx="6" cy="4" r="3.4" fill="#0B0B0F"/>
    <circle cx="-3" cy="4" r="1.6" fill="#E2E8F0"/>
    <circle cx="8" cy="4" r="1.6" fill="#E2E8F0"/>
  </g>
  <g transform="translate(-120,35)">
    <animateTransform attributeName="transform" type="translate" from="-120 35" to="1180 35" dur="8s" begin="2.3s" repeatCount="indefinite"/>
    <g filter="url(#glowGhost)">
      <path d="M -14,8 A14,14 0 1 1 14,8 L14,18 L9,13 L4,18 L0,13 L-4,18 L-9,13 L-14,18 Z" fill="#F472B6">
        <animate attributeName="d" dur="0.5s" repeatCount="indefinite" values="
          M -14,8 A14,14 0 1 1 14,8 L14,18 L9,13 L4,18 L0,13 L-4,18 L-9,13 L-14,18 Z;
          M -14,8 A14,14 0 1 1 14,8 L14,16 L9,20 L4,15 L0,20 L-4,15 L-9,20 L-14,16 Z;
          M -14,8 A14,14 0 1 1 14,8 L14,18 L9,13 L4,18 L0,13 L-4,18 L-9,13 L-14,18 Z"/>
      </path>
    </g>
    <circle cx="-5" cy="4" r="3.4" fill="#0B0B0F"/>
    <circle cx="6" cy="4" r="3.4" fill="#0B0B0F"/>
    <circle cx="-7" cy="4" r="1.6" fill="#E2E8F0"/>
    <circle cx="4" cy="4" r="1.6" fill="#E2E8F0"/>
  </g>

  <g filter="url(#glowY)">
    <animateTransform attributeName="transform" type="translate" from="-50 0" to="1250 0" dur="8s" repeatCount="indefinite"/>
    <path fill="#FFD400">
      <animate attributeName="d" values="M30,30 L49,17.4 A22,22 0 1 1 49,42.6 Z;M30,30 L52,29 A22,22 0 1 1 52,31 Z;M30,30 L49,17.4 A22,22 0 1 1 49,42.6 Z" dur="0.28s" repeatCount="indefinite"/>
    </path>
    <circle cx="45" cy="18" r="2.8" fill="#0B0B0F"/>
  </g>
</svg>
