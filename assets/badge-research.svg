<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="96" role="img" aria-label="badge-research.svg badge">
  <title>badge-research.svg badge</title>
  <defs>
    <filter id="glowY" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowP" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="70" cy="70" r="46" fill="none" stroke="#3B6E8F" stroke-width="2" opacity="0.7">
    <animate attributeName="r" values="46;62;46" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0;0.7" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="70" cy="70" r="46" fill="#10161C" stroke="#3B6E8F" stroke-width="2.5"/>
  <g filter="url(#glowY)">
    <path d="M52,42 h28 l10,10 v46 h-38 Z" fill="none" stroke="#8FB4CC" stroke-width="4" stroke-linejoin="round"/>
    <path d="M80,42 v10 h10" fill="none" stroke="#8FB4CC" stroke-width="4" stroke-linejoin="round"/>
    <line x1="58" y1="66" x2="82" y2="66" stroke="#8FB4CC" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="58" y1="76" x2="82" y2="76" stroke="#8FB4CC" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="58" y1="86" x2="74" y2="86" stroke="#8FB4CC" stroke-width="3.5" stroke-linecap="round"/></g>
</svg>
