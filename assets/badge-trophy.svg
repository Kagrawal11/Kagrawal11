<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="96" role="img" aria-label="badge-trophy.svg badge">
  <title>badge-trophy.svg badge</title>
  <defs>
    <filter id="glowY" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowP" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="70" cy="70" r="46" fill="none" stroke="#F2A93B" stroke-width="2" opacity="0.7">
    <animate attributeName="r" values="46;62;46" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0;0.7" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="70" cy="70" r="46" fill="#10161C" stroke="#F2A93B" stroke-width="2.5"/>
  <g filter="url(#glowY)">
    <path d="M50,50 h40 v14 a20,20 0 0 1 -40,0 Z" fill="#F2A93B"/>
    <path d="M50,52 c-12,0 -14,18 2,20" fill="none" stroke="#F2A93B" stroke-width="4" stroke-linecap="round"/>
    <path d="M90,52 c12,0 14,18 -2,20" fill="none" stroke="#F2A93B" stroke-width="4" stroke-linecap="round"/>
    <rect x="65" y="82" width="10" height="10" fill="#F2A93B"/>
    <rect x="54" y="92" width="32" height="7" rx="2" fill="#F2A93B"/></g>
</svg>
